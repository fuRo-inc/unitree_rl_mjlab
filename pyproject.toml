[project]
name = "unitree-rl-mjlab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "prettytable",
  "tqdm",
  "tyro>=1.0.1",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "torchaudio==2.8.0",
  "torchrunx>=0.3.4",
  "warp-lang>=1.11.0.dev20251211",
  "mujoco-warp",
  "mujoco>=3.4.0",
  "trimesh>=4.8.3",
  "viser>=1.0.16",
  "moviepy",
  "tensordict",
  "rsl-rl-lib==3.1.0",
  "tensorboard>=2.20.0",
  "onnxscript>=0.5.4",
  "wandb>=0.22.3",
  "setuptools<80.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mjlab*", "scripts*"]

[tool.uv.sources]
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", rev = "7c20a44bfed722e6415235792a1b247ea6b6a6d3" }
